# Spring properties 
spring.application.name=multiplication-service 
spring.freemarker.enabled=false 
spring.thymeleaf.cache=false 
spring.thymeleaf.prefix=classpath:/multiplication-server/templates/ 
error.path=/error 
# HTTP Server 
server.port=4446 
eureka.client.serviceUrl.defaultZone=http://localhost:5467/eureka/ // INPUT_REQUIRED {Eureka server URL} 
eureka.client.instance.leaseRenewalIntervalInSeconds=5